[project]
name = "ytube-summarizer"
version = "0.1.0"
description = "YouTube video summarizer with local LLM support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "requests>=2.34.2",
    "uvicorn>=0.51.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
